[project]
name = "fasal-kavach"
version = "0.1.0"
description = "Field-level climate-risk agent for Indian farmers"
authors = [
    { name = "shubhambhattog", email = "shubhambhatt2206@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rasterio>=1.5.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
